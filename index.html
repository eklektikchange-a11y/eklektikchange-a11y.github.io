html,body{margin:0;padding:0;background:#030712;color:#e8f0ff;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body{padding:12px;box-sizing:border-box;min-height:100vh}
@media (max-width:759px){html,body{position:fixed;inset:0;overflow:hidden;height:100%;width:100%;padding:0}}
button{-webkit-appearance:none;appearance:none}
.globe-wrap{background:radial-gradient(1px 1px at 12% 18%,#cfe0ff 50%,transparent 51%),radial-gradient(1px 1px at 73% 12%,#cfe0ff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 38% 82%,#cfe0ff 50%,transparent 51%),radial-gradient(1px 1px at 88% 64%,#cfe0ff 50%,transparent 51%),radial-gradient(1px 1px at 22% 58%,#9fb8e8 50%,transparent 51%),radial-gradient(1.5px 1.5px at 61% 36%,#cfe0ff 50%,transparent 51%),radial-gradient(1px 1px at 5% 90%,#9fb8e8 50%,transparent 51%),radial-gradient(1px 1px at 95% 30%,#9fb8e8 50%,transparent 51%),radial-gradient(1px 1px at 48% 6%,#cfe0ff 50%,transparent 51%),radial-gradient(1px 1px at 80% 92%,#cfe0ff 50%,transparent 51%),radial-gradient(ellipse at 50% 40%,#0b1d42 0%,#050c22 60%,#02050f 100%)}
.maplibregl-map{font-family:inherit}
.maplibregl-ctrl-attrib{font-size:10px;background:rgba(10,16,32,.7)!important;color:#a3b3cf}
.maplibregl-ctrl-attrib a{color:#cfe0ff}
.maplibregl-ctrl-attrib-button{filter:invert(1)}
.gm{position:relative;width:0;height:0;cursor:pointer}
.gm-pin{position:absolute;left:-10px;top:-27px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.65));transform-origin:50% 100%;transition:transform .2s}
.gm-pin path{transition:fill .2s}
.gm-label{position:absolute;left:11px;top:-27px;white-space:nowrap;font:600 12.5px/18px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#fff;text-shadow:0 0 2px #000,0 0 4px #000,0 0 8px rgba(0,0,0,.9);transition:opacity .2s}
.gm-nolabel .gm-label{opacity:0}
.gm-hidden{display:none!important}
.maplibregl-marker[style*="opacity: 0"]{pointer-events:none}
.gm-home{z-index:6}.gm-home::before{content:"";position:absolute;left:-17px;top:-43px;width:34px;height:44px}
.gm-cluster{position:relative;width:0;height:0;cursor:pointer;z-index:4}
.gm-cnum{position:absolute;left:-15px;top:-15px;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 13px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#fff;background:linear-gradient(160deg,#7dd3fc 0%,#38bdf8 45%,#1d4ed8 100%);border:2px solid #fff;box-shadow:0 0 0 5px rgba(56,189,248,.25),0 2px 8px rgba(0,0,0,.6);text-shadow:0 1px 2px rgba(0,0,0,.45)}
.gm-csel .gm-cnum{box-shadow:0 0 0 3px #ffcc4d,0 0 12px rgba(255,204,77,.8)}
.route-chip{z-index:7;pointer-events:none;}
.route-chip .rc-in{padding:5px 10px;border-radius:10px;background:rgba(6,24,20,.88);border:1px solid rgba(52,211,153,.75);color:#d1fae5;font:600 11.5px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;white-space:nowrap;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.45)}
.route-chip .rc-t{color:#cfe0ff;font-weight:500;white-space:pre}
.gm-sel .gm-pin{transform:scale(1.28)}
.gm-sel .gm-pin path{fill:#ffcc4d}
.gm-sel .gm-label{color:#ffe3a3}
.gm-house{position:absolute;left:-12.5px;top:-31px;transform-origin:50% 100%;will-change:transform;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6)) drop-shadow(0 0 7px rgba(34,197,94,.55))}
.rail button::after{content:"";position:absolute;top:-20%;bottom:-20%;left:-80%;width:55%;background:linear-gradient(105deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.08) 30%,rgba(255,255,255,.55) 50%,rgba(255,255,255,.08) 70%,rgba(255,255,255,0) 100%);transform:skewX(-18deg);opacity:0;pointer-events:none}.rail button.shine::after{animation:railshine .6s cubic-bezier(.3,.7,.4,1) both}@keyframes railshine{0%{left:-80%;opacity:0}15%{opacity:1}100%{left:130%;opacity:0}}.rail button.shine{animation:railglow .6s ease-out}@keyframes railglow{0%{box-shadow:0 0 0 rgba(160,220,255,0)}30%{box-shadow:0 0 14px rgba(160,220,255,.55)}100%{box-shadow:0 0 0 rgba(160,220,255,0)}}
.srch-lab{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:#6ee7b7;line-height:1.2}.srch-in::placeholder{font-size:14px;color:rgba(200,214,240,.5)}.srch-in::-webkit-input-placeholder{font-size:14px;color:rgba(200,214,240,.5)}
.sk{background:linear-gradient(90deg,rgba(255,255,255,.05) 0%,rgba(255,255,255,.13) 50%,rgba(255,255,255,.05) 100%);background-size:200% 100%;animation:skm 1.2s linear infinite}@keyframes skm{0%{background-position:100% 0}100%{background-position:-100% 0}}
.gm-pulse{position:absolute;left:-11px;top:-11px;width:22px;height:22px;border-radius:50%;border:2px solid rgba(74,222,128,.95);box-shadow:0 0 6px rgba(74,222,128,.45);pointer-events:none;will-change:transform,opacity;transform:scale(.35);opacity:0;animation:gmp 1.8s cubic-bezier(.22,.61,.36,1) infinite}
.gm-pulse.gm-p2{animation-delay:-.6s}
.gm-pulse.gm-p3{animation-delay:-1.2s}
.gm-bp{position:absolute;left:-11px;top:-11px;width:22px;height:22px;border-radius:50%;border:2px solid rgba(56,189,248,.95);box-shadow:0 0 6px rgba(56,189,248,.5);pointer-events:none;will-change:transform,opacity;transform:scale(.35);opacity:0;display:none}
.gm-sel .gm-bp{display:block;animation:gmp 1.8s cubic-bezier(.22,.61,.36,1) infinite}
.gm-sel .gm-bp.gm-p2{animation-delay:-.6s}
.gm-sel .gm-bp.gm-p3{animation-delay:-1.2s}
@keyframes gmp{0%{transform:scale(.35);opacity:.95}70%{opacity:.35}100%{transform:scale(3);opacity:0}}

.sp-root{--S:min(98vw,600px,max(260px,calc((50vh - 150px) * 2.04)));--S:min(98vw,600px,max(260px,calc((50svh - 150px) * 2.04)));--h:calc(var(--S) * 0.49);--cy:calc(50% + 18px)}

.sp-title{text-align:center;font:400 31px/1.22 "Josefin Sans",sans-serif;letter-spacing:.3em;text-indent:.3em;color:#fbf8f1;text-transform:uppercase;white-space:nowrap;text-shadow:0 0 3px rgba(0,0,0,.95),0 1px 10px rgba(0,0,0,.85),0 0 26px rgba(4,10,30,.9),0 0 34px rgba(120,190,255,.55);pointer-events:none;animation:spin 1.6s ease both}
.sp-tap{position:absolute;left:0;right:0;bottom:calc(78px + env(safe-area-inset-bottom, 0px));display:flex;justify-content:center;pointer-events:none;animation:spgoin 1s .9s ease both}.sp-go{pointer-events:auto;-webkit-appearance:none;appearance:none;margin:0;padding:16px 28px;min-width:260px;min-height:52px;max-width:calc(100vw - 32px);border:0;border-radius:0;background:transparent;box-shadow:none;outline:none;color:#f4f1ea;font:400 13px "Josefin Sans",sans-serif;letter-spacing:.16em;text-indent:.16em;text-transform:uppercase;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;white-space:normal;line-height:1.5;animation:spgo 3s 1.9s ease-in-out infinite both;transition:transform .15s ease}.sp-go:active{transform:scale(.97)}.sp-go:focus-visible{outline:1px solid rgba(170,215,255,.6);outline-offset:-4px}@keyframes spgoin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes spgo{0%,100%{opacity:.6;text-shadow:0 0 6px rgba(120,190,255,.25),0 0 2px rgba(0,0,0,.9)}50%{opacity:1;text-shadow:0 0 14px rgba(140,205,255,.75),0 0 28px rgba(90,170,255,.35),0 0 2px rgba(0,0,0,.9)}}
@keyframes spin{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes sptap{0%,100%{opacity:.35}50%{opacity:.95}}
.sp-depart .sp-title,.sp-depart .sp-tap,.sp-depart .pre-load{opacity:0;transition:opacity .45s ease;pointer-events:none;animation:none!important}

.gm-small .gm-pin{transform:scale(.7)}
.gm-small .gm-label{font-size:11px;left:7px;top:-24px}
.gm-sel .gm-pin{transform:scale(1.28)}
.gm:not(.gm-home){opacity:calc(1 - .65*var(--spk,0))}
